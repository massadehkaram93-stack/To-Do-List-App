        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="cloudflare.com"/>
        <link rel="stylesheet" href="./css/main.css">
        <title>To -Do List App</title>

                        </div>

                        <div class = "email">
                            <input type="text" required placeholder="Email" name = "userName" id = "register-Email">
                            <label for="register-Email">✉</label>
                        </div>

                        <div class="password">
                            <input type="password" required placeholder="Password" name = "password" id = "register-password">
                            <label for="register-password">🔐</label>
                        </div>

                        <button type="submit" class = "submit-register">Register</button>

                    <h3>Login</h3>

                    <form action="#">
                        <div class="user-name">
                            <input type="email" required placeholder="Email" name = "Email" id = "login-Email">
                            <label for="login-Email">✉</label>
                        </div>

                        <div class="password">
                            <input type="password" required placeholder="password" name = "password" id = "login-password">
                            <label for="login-password">🔐</label>
                        </div>

                        <button type="submit" class = "submit-login">login</button>

                    </form>

                                </svg>
                            </li>
                        </ul>
                    </div>

                </div>

            </div>

        </section>   
        
        <div id="custom-alert" class="none">
            <span class = "alert-text">An account with this email already exists 🔐</span>
        </div>

        <section id = "loading-screen" class = "none">
            
            <div class="title">
                <h2>Please Wait</h2>
            </div>

            <div class = "loud">
                <div class = "one"></div>
                <div class = "two"></div>
                <div class = "three"></div>
            </div>
            
        </section>     

        <section id = "app-main-screen">

            <div class="main-screen">

                <div class="mode-name-box">

                    <h2 class="user-name">Welcome,Unkown ✨</h2>

                    <button class = "mode">
                        <svg width="25" height="25" viewBox="0 0 24 24" fill="currentColor" class = "mode-icon">
                            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                        </svg>
                    </button>
                </div>

                <div class="title">
                    <h2>To-Do list</h2>
                </div>

                <div class="content">

                    <div class="search-box">
                        <input type="text" class="search-input" id = "search" placeholder = "Search">
                        <label for="search">🔎</label>
                    </div>

                    <div class="add-box">
                        <input type="text" placeholder="Add a new task..." class = "add-input">
                        <button class="add-btn">+ add</button>
                    </div>

                </div>

                <div class="display">

                    <div class="buttons">
                        <ul>
                            <li><button class = "all-btn">All</button></li>
                            <li><button class = "active-btn">Active</button></li>
                            <li><button class = "complet-btn">Complete</button></li>
                        </ul>
                    </div>

                    <div class="display-tasks">

                        <ul class = "all-tasks none">
                            You didn't add any task yet
                        </ul>

                        <div class="color-task">

                            <p>Priority</p>

                            <ul>
                                <li><button class = "red"></button></li>
                                <li><button class = "yellow"></button></li>
                                <li><button class = "green"></button></li>
                            </ul>

                        </div>
                    </div>
                </div>
            </div>
        </section>    

        <script type="module" src="./js/main.js"></script>
    </body>

</html>
